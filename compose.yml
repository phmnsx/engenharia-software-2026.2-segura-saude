


x-rabbit-env: &r-env #Variaveis relacionadas a rabbitmq
    RABBITMQ_HOST: placeholder

#Definição de um gateway
x-gateway : &gateway
    build: ./src/api
    environment:
        <<: *r-env
    expose:
    - "8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
        - mainServer

services:
    rabbitmq:
        image: rabbitmq:4-management
        ports:
        - "5672:5672"
        - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: placeholder
            RABBITMQ_DEFAULT_PASS: placeholder
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
        - mainServer

    nginx:
        image: nginx:alpine
        ports:
        - "8080:80"
        depends_on:
            gateway-1:
                condition: service_healthy 
            gateway-2:
                condition: service_healthy
            gateway-3:
                condition: service_healthy
        volumes:
        - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
        - mainServer
    
    gateway-1:
        <<: *gateway
        container_name: gateway-1
        hostname: gateway-1

    gateway-2:
        <<: *gateway
        container_name: gateway-2
        hostname: gateway-2
        
    gateway-3:
        <<: *gateway
        container_name: gateway-3
        hostname: gateway-3
networks:
  mainServer:
        
